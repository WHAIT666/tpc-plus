name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: vet, lint, test, fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # No third-party dependencies yet, so there is no go.sum.
          cache-dependency-path: backend/go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: fuzz the answer parser
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=10s ./internal/grading
